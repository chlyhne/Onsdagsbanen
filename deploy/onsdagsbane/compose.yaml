services:
  onsdagsbane:
    build:
      context: ../..
      dockerfile: deploy/onsdagsbane/Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    env_file: .env
    volumes:
      - onsdagsbane-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  onsdagsbane-data:
